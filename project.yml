name: GreyVision

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    MARKETING_VERSION: 5.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    DEVELOPMENT_TEAM: 5NCWM6DS4H
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ENABLE_PREVIEWS: YES

targets:
  GreyVision:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: GreyVision
        excludes:
          # Spec/planning notes, not source.
          - ".kiro/**"
    info:
      path: GreyVision/Resources/Info.plist
      properties:
        CFBundleDisplayName: greyVISION v5
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: grey//VISION uses the camera to render live visual effects.
        NSMicrophoneUsageDescription: grey//VISION uses microphone audio for recording and audio-reactive modulation when you enable it.
        NSPhotoLibraryAddUsageDescription: grey//VISION saves captures to Photos only when you ask it to.
        NSPhotoLibraryUsageDescription: grey//VISION saves captures to Photos only when you ask it to.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: GreyVision
        INFOPLIST_FILE: GreyVision/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.saringrey.greyvision
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies: []

  GreyVisionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: GreyVisionTests
    dependencies:
      - target: GreyVision
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saringrey.greyvision.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/GreyVision.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/GreyVision
        BUNDLE_LOADER: $(TEST_HOST)

  GreyVisionUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: GreyVisionUITests
    dependencies:
      - target: GreyVision
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saringrey.greyvision.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GreyVision

schemes:
  GreyVision:
    build:
      targets:
        GreyVision: all
        GreyVisionTests: [test]
        GreyVisionUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: GreyVisionTests
          parallelizable: true
          randomExecutionOrder: true
        - name: GreyVisionUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
