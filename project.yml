name: GreyVision

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    MARKETING_VERSION: 5.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    # The team is "Mister Grey" (L8V6HKA9MZ). The development certificate's
    # common name carries the Apple ID (glassxxhouse@gmail.com, Z6L5R7B543),
    # which is not the team — the team is the certificate's OU and the
    # provisioning profile's TeamIdentifier, both L8V6HKA9MZ. Putting the
    # Apple ID here makes xcodebuild fail with "No Accounts: Add a new account
    # in Accounts settings" even though a perfectly good profile for this App
    # ID is already on disk, because it starts searching for a team that does
    # not exist.
    DEVELOPMENT_TEAM: L8V6HKA9MZ
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ENABLE_PREVIEWS: YES

targets:
  GreyVision:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: GreyVision
        excludes:
          # Spec/planning notes, not source.
          - ".kiro/**"
          # Agent 3 prototypes overlap production composition and gesture
          # models. Keep the delivery on disk without compiling duplicate
          # same-module declarations into the shipping application.
          - "Features/Interaction/GestureCoordinator.swift"
          - "Features/Interaction/GestureRecordingAutomation.swift"
          - "Features/Interaction/InteractionModule.swift"
          - "Features/Interaction/MacroEngine.swift"
          - "Features/Interaction/ModulationEngine.swift"
          - "Features/Interaction/UIStateMachine.swift"
          - "Features/Interaction/WildCardMutate.swift"
          - "Features/Performance/**"
          - "Features/Workspace/PresetSceneMorph.swift"
          - "Features/Workspace/EffectBrowser.swift"
          - "Engine/Capture/PerformanceMetadata.swift"
          - "Engine/Capture/PerformanceRecorder.swift"
    info:
      path: GreyVision/Resources/Info.plist
      properties:
        CFBundleDisplayName: greyVISION v5
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        # XcodeGen rewrites Resources/Info.plist on every generate, so bundled
        # fonts have to be declared here — editing the plist by hand loses them
        # at the next run.
        # Path is the name alone, not Fonts/…: the resource is copied flat to
        # the bundle root, and a UIAppFonts entry that does not resolve makes
        # Font.custom fall back to the system face without erroring.
        UIAppFonts:
          - MadhouseSans.otf
          - Code.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: grey//VISION uses the camera to render live visual effects.
        NSMotionUsageDescription: grey//VISION uses device motion to drive interactive splash and camera effects.
        # Required to advertise the Mac link over Bonjour. Without both keys
        # NWListener fails at .ready with a permission error rather than at
        # build time, so their absence looks like a networking bug.
        NSLocalNetworkUsageDescription: grey//VISION streams the processed camera image to the greyVISION virtual camera on your Mac over your local network.
        NSBonjourServices:
          - _greyvision._tcp
        NSMicrophoneUsageDescription: grey//VISION uses microphone audio for recording and audio-reactive modulation when you enable it.
        NSPhotoLibraryAddUsageDescription: grey//VISION saves your captures straight to your photo library.
        NSPhotoLibraryUsageDescription: grey//VISION saves your captures straight to your photo library.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: GreyVision
        INFOPLIST_FILE: GreyVision/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.saringrey.greyvision
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies: []

  GreyVisionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: GreyVisionTests
    dependencies:
      - target: GreyVision
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saringrey.greyvision.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/GreyVision.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/GreyVision
        BUNDLE_LOADER: $(TEST_HOST)

  GreyVisionUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: GreyVisionUITests
    dependencies:
      - target: GreyVision
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saringrey.greyvision.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GreyVision

schemes:
  GreyVision:
    build:
      targets:
        GreyVision: all
        GreyVisionTests: [test]
        GreyVisionUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: GreyVisionTests
          parallelizable: true
          randomExecutionOrder: true
        - name: GreyVisionUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
