name: GreyVisionMacCapture
options:
  bundleIdPrefix: com.nicholasprehn.greyvision
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 5NCWM6DS4H
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
targets:
  GreyVisionMacCapture:
    type: application
    platform: macOS
    sources:
      - Sources
      # The wire contract, compiled from the iOS tree rather than copied here.
      # A hand-kept duplicate is how a protocol drifts: the previous copy had
      # already diverged (its header decode required an exact length where the
      # phone's accepts at least that many bytes).
      - path: ../GreyVision/Engine/Broadcast/GVBroadcastProtocol.swift
        group: Shared
      - path: ../GreyVision/Engine/Broadcast/GVBroadcastControlSurface.swift
        group: Shared
    info:
      path: Resources/Info.plist
      # XcodeGen owns this plist and rewrites it on every generate, so these
      # keys have to live here — editing Resources/Info.plist by hand loses
      # them at the next `xcodegen generate`.
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: GreyVision uses a nearby iPhone as a Continuity Camera to preview its live picture.
        NSMicrophoneUsageDescription: GreyVision can capture audio from a nearby iPhone alongside its Continuity Camera video.
        # Opts this app into the .continuityCamera device type on macOS 14+.
        # Harmless on older systems, which surface an iPhone as
        # .externalUnknown instead.
        NSCameraUseContinuityCameraDeviceType: true
    entitlements:
      path: Resources/GreyVisionMacCapture.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.camera: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholasprehn.greyvision.maccapture
        PRODUCT_NAME: GreyVisionMacCapture
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/GreyVisionMacCapture.entitlements
